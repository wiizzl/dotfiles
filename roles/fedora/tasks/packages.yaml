---
- name: Enable COPR repositories
  become: true
  community.general.copr:
    name: "{{ item }}"
    state: enabled
  loop:
    - rossetnocpes/herdr

- name: Install native system packages
  become: true
  ansible.builtin.dnf:
    name:
      - ffmpeg
      - micro
      - chezmoi
      - mise
      - tailscale

      - bat
      - eza
      - fzf
      - herdr
      - zoxide
      - gitui
      - lazyssh
      - fastfetch
      - gh
      - starship

      - "@virtualization"
      - zed
      - vesktop
      - helium-browser-bin
    state: present

- name: Install multimedia group packages
  become: true
  ansible.builtin.dnf:
    name: "@multimedia"
    state: present
    exclude: PackageKit-gstreamer-plugin

- name: Enable system services
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
  loop:
    - tailscaled
