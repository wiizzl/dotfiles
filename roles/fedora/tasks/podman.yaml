---
- name: Install Podman and related tools
  become: true
  ansible.builtin.dnf:
    name:
      - podman
      - podman-compose
      - podman-docker
      - podman-tui
    state: present

- name: Silence Podman Docker emulation warning
  become: true
  ansible.builtin.file:
    path: /etc/containers/nodocker
    state: touch
    mode: "0644"
    modification_time: preserve
    access_time: preserve
