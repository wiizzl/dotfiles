---
- ansible.builtin.include_tasks: dependencies.yaml

- ansible.builtin.include_tasks: bitwarden.yaml
  when: enable_bitwarden | bool

- name: Initialize and apply dotfiles
  block:
    - name: Ensure local share directory exists
      ansible.builtin.file:
        path: "~/.local/share"
        state: directory
        mode: "0755"

    - name: Prepare local chezmoi source directory
      ansible.builtin.file:
        src: "{{ playbook_dir }}/chezmoi"
        dest: "~/.local/share/chezmoi"
        state: link
        force: true
        follow: false

    - name: Initialize dotfiles
      ansible.builtin.command:
        argv:
          - chezmoi
          - init
          - --source
          - "{{ playbook_dir }}"
          # Each key is the prompt TEXT from chezmoi/.chezmoi.toml.tmpl, not the variable name:
          # a key that does not match makes chezmoi ask on a TTY, which Ansible does not have.
          - --promptBool
          - "Use Bitwarden for SSH keys and commit signing={{ enable_bitwarden | bool | lower }}"
          - --promptString
          - "Git name (leave blank to skip)={{ user_git_name }}"
          - --promptString
          - "Git email (leave blank to skip)={{ user_git_email }}"
      changed_when: false

    - name: Apply dotfiles
      ansible.builtin.command:
        cmd: "chezmoi apply"
      environment: "{{ {'BW_SESSION': bw_session} if bw_session is defined else {} }}"
      register: chezmoi_apply
      changed_when: chezmoi_apply.stdout | length > 0
