---
- name: Check for required tools
  ansible.builtin.command: "command -v {{ item }}"
  loop:
    - git
    - chezmoi
  register: tool_check
  changed_when: false
  failed_when: tool_check.rc != 0

- name: Initialize and apply dotfiles
  block:
    - name: Ensure local share directory exists
      ansible.builtin.file:
        path: "~/.local/share"
        state: directory
        mode: "0755"

    - name: Prepare local chezmoi source directory
      ansible.builtin.file:
        src: "{{ playbook_dir }}/chezmoi"
        dest: "~/.local/share/chezmoi"
        state: link
        force: true
        follow: false

    - name: Initialize dotfiles
      ansible.builtin.command:
        argv:
          - chezmoi
          - init
          - --source
          - "{{ playbook_dir }}"
          - --promptDefaults
      environment:
        DOTFILES_BITWARDEN_SSH: "{{ bitwarden_ssh | bool | lower }}"
        DOTFILES_GIT_SIGNING_KEY: "{{ git_signing_key }}"
        DOTFILES_GIT_NAME: "{{ user_git_name }}"
        DOTFILES_GIT_EMAIL: "{{ user_git_email }}"
      changed_when: false

    - name: Apply dotfiles
      ansible.builtin.command:
        cmd: "chezmoi apply"
      register: chezmoi_apply
      changed_when: chezmoi_apply.stdout | length > 0
