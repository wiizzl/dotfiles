---
- hosts: localhost
  connection: local
  gather_facts: true

  vars_prompt:
    - name: bitwarden_ssh
      prompt: "Do you want to use the Bitwarden SSH agent?"
      default: "false"
      private: false

    - name: git_signing_key
      prompt: "What is your SSH public key for commit signing? (Leave blank to skip)"
      default: ""
      private: false

    - name: user_git_name
      prompt: "What is your git name? (Leave blank to skip)"
      default: ""
      private: false

    - name: user_git_email
      prompt: "What is your git email? (Leave blank to skip)"
      default: ""
      private: false

  tasks:
    - ansible.builtin.include_role:
        name: fedora
      when: ansible_facts['distribution'] == "Fedora"

    - ansible.builtin.include_role:
        name: macos
      when: ansible_facts['os_family'] == "Darwin"

    - ansible.builtin.include_role:
        name: chezmoi
