name: Build image

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - image/**
      - "!image/**/README.md"
      - .github/workflows/build-image.yaml
  pull_request:
    paths:
      - Containerfile
      - image/**
      - "!image/**/README.md"
      - .github/workflows/build-image.yaml
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/atomic

jobs:
  build:
    name: ${{ matrix.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: pier, variant: pier, base: image/pier/base }
          - { tag: pier-nvidia, variant: pier, base: image/pier/base-nvidia }
          - { tag: family, variant: family, base: image/family/base }
    steps:
      - uses: projectbluefin/actions/bootc-build/setup-runner@59f783ed76fd9d449ef6887a6649446801bd5434 # v1

      - uses: actions/checkout@v7

      - name: Build image
        id: build
        run: |
          date=$(date +%Y%m%d)
          echo "date=$date" >> "$GITHUB_OUTPUT"

          sudo podman build \
            --build-arg BASE_IMAGE="$(cat ${{ matrix.base }})" \
            --build-arg VARIANT=${{ matrix.variant }} \
            --build-arg CI=true \
            --label org.opencontainers.image.title=atomic \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label "org.opencontainers.image.version=${{ matrix.tag }}-$date" \
            -t localhost/atomic-build:${{ matrix.tag }} .

          if skopeo inspect --raw "docker://$IMAGE:${{ matrix.tag }}" >/dev/null 2>&1; then
            echo "previous=docker://$IMAGE:${{ matrix.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: projectbluefin/actions/bootc-build/rechunk@59f783ed76fd9d449ef6887a6649446801bd5434 # v1
        with:
          source-image: localhost/atomic-build:${{ matrix.tag }}
          output-image: atomic:${{ matrix.tag }}
          max-layers: 96
          previous-build: ${{ steps.build.outputs.previous }}

      - uses: projectbluefin/actions/bootc-build/push-image@59f783ed76fd9d449ef6887a6649446801bd5434 # v1
        id: push
        if: github.event_name != 'pull_request'
        with:
          image-name: atomic
          tags: ${{ matrix.tag }} ${{ matrix.tag }}-${{ steps.build.outputs.date }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: projectbluefin/actions/bootc-build/sign-and-publish@59f783ed76fd9d449ef6887a6649446801bd5434 # v1
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PASSWORD: ""
        with:
          image: ${{ env.IMAGE }}
          digest: ${{ steps.push.outputs.digest }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          signing-mode: key
          signing-key: ${{ secrets.SIGNING_SECRET }}
          generate-sbom: false
          push-attestation: false
