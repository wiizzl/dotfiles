name: Cleanup old images

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: atomic
          older-than: 90 days
          delete-tags: "*-20*"
          delete-untagged: true
