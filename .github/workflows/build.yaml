name: Build image

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - image/**
      - "!image/**/README.md"
      - .github/workflows/build.yaml
  pull_request:
    paths:
      - Containerfile
      - image/**
      - "!image/**/README.md"
      - .github/workflows/build.yaml
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/atomic

jobs:
  variants:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7

      # Each base file is one image: image/pier/base-nvidia is tagged pier-nvidia
      - name: List variants
        id: list
        run: |
          list=$(find image -mindepth 2 -maxdepth 2 -name 'base*' | sort | jq -Rnc '
            [inputs | . as $base | capture("^image/(?<variant>[^/]+)/base(?<flavor>.*)$")
              | {variant, tag: (.variant + .flavor), base: $base}]')
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.tag }}
    needs: variants
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.variants.outputs.list) }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - uses: actions/checkout@v7

      - name: Build image
        run: |
          sudo podman build \
            --build-arg BASE_IMAGE="$(cat ${{ matrix.base }})" \
            --build-arg VARIANT=${{ matrix.variant }} \
            --build-arg CI=true \
            --label org.opencontainers.image.title=atomic \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label "org.opencontainers.image.version=${{ matrix.tag }}-$(date +%Y%m%d)" \
            -t localhost/atomic:${{ matrix.tag }} .

      # Split the image into per-package layers so that updates only download
      # what changed, keeping the layout of the previously published image
      - name: Rechunk image
        run: |
          args=()
          if skopeo inspect --raw "docker://$IMAGE:${{ matrix.tag }}" >/dev/null 2>&1; then
            args+=(--previous-build="docker://$IMAGE:${{ matrix.tag }}")
          fi
          sudo podman run --rm --privileged --security-opt label=disable \
            -v /var/lib/containers:/var/lib/containers \
            localhost/atomic:${{ matrix.tag }} \
            rpm-ostree compose build-chunked-oci \
              --bootc \
              --format-version=2 \
              --max-layers=96 \
              "${args[@]}" \
              --from=localhost/atomic:${{ matrix.tag }} \
              --output="containers-storage:$IMAGE:${{ matrix.tag }}"
          sudo podman rmi localhost/atomic:${{ matrix.tag }}
          sudo podman tag "$IMAGE:${{ matrix.tag }}" "$IMAGE:${{ matrix.tag }}-$(date +%Y%m%d)"

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push "$IMAGE:${{ matrix.tag }}"
          sudo podman push "$IMAGE:${{ matrix.tag }}-$(date +%Y%m%d)"
