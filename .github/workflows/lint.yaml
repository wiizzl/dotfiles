name: Lint

on:
  push:
    paths:
      - "image/**.sh"
      - .github/workflows/lint.yaml
  pull_request:
    paths:
      - "image/**.sh"
      - .github/workflows/lint.yaml

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: shellcheck image/*.sh image/*/scripts/*.sh
